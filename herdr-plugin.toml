id = "chriszarate.terminal-titles"
name = "Terminal titles"
version = "0.1.3"
min_herdr_version = "0.9.5"
description = "Set each tab's label to the terminal title of the tab's active pane."
platforms = ["linux", "macos"]

# `herdr plugin link` does not run this step: build by hand after a change.
[[build]]
command = ["go", "build", "-o", "bin/herdr-titles", "."]
platforms = ["linux", "macos"]

# The watch daemon: subscribes to the session's socket event stream (incl.
# pane.updated, which plugin hooks can't receive) and syncs the tab labels
# after every burst of events. The spawned process daemonizes immediately so
# no plugin slot stays pinned.
[[startup]]
command = ["./bin/herdr-titles", "watch"]

# Watchdog hooks: the daemon handles all events over the socket stream. These
# two low-volume hooks exist to DETECT a dead daemon (flock probe) and revive
# it; with a live daemon they exit immediately.
[[events]]
on = "workspace.focused"
command = ["./bin/herdr-titles", "watchdog"]

[[events]]
on = "tab.focused"
command = ["./bin/herdr-titles", "watchdog"]

# Run one sync pass by hand:
#   herdr plugin action invoke chriszarate.terminal-titles.sync
[[actions]]
id = "sync"
title = "Terminal titles: sync tab labels now"
contexts = ["global"]
command = ["./bin/herdr-titles", "sync"]
